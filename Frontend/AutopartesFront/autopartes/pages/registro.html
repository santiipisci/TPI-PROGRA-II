<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse · Motorix Autopartes</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../styles/main.css" rel="stylesheet">
  <link href="../styles/animations.css" rel="stylesheet">
</head>
<body>
  <div id="app-header"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-7">
        <div class="glass p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="icon-tile mx-auto mb-3"><i class="bi bi-person-plus"></i></div>
            <h1 class="h4 fw-bold">Crear cuenta</h1>
            <p class="small text-muted-2 mb-0">Completá tus datos para registrarte como cliente.</p>
          </div>
<form id="registroForm" novalidate>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="rTipo">Tipo de cliente</label><select id="rTipo" class="form-select" required></select></div>
              <div class="col-md-6"><label class="form-label" for="rNombre">Nombre / Razón social</label><input id="rNombre" class="form-control" required maxlength="100" autocomplete="name"></div>
              <div class="col-md-6"><label class="form-label" for="rDoc">Documento / CUIL</label><input id="rDoc" class="form-control" required maxlength="13" inputmode="numeric" placeholder="Solo números o con guiones"></div>
              <div class="col-md-6"><label class="form-label" for="rTel">Teléfono</label><input id="rTel" type="tel" inputmode="numeric" pattern="[0-9]{7,15}" class="form-control" required maxlength="15" autocomplete="tel"></div>
              <div class="col-12"><label class="form-label" for="rDir">Dirección</label><input id="rDir" class="form-control" required maxlength="150" autocomplete="street-address"></div>
              <div class="col-12"><label class="form-label" for="rEmail">Email</label><input id="rEmail" type="email" class="form-control" required maxlength="100" autocomplete="email"></div>
              <div class="col-md-6">
                <label class="form-label" for="rClave">Contraseña</label>
                <div class="input-group">
                  <input id="rClave" type="password" class="form-control" required minlength="8" autocomplete="new-password">
                  <button class="btn btn-glass password-toggle" type="button" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                </div>
                <div class="form-text">Mínimo 8 caracteres.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="rClave2">Repetir contraseña</label>
                <div class="input-group">
                  <input id="rClave2" type="password" class="form-control" required autocomplete="new-password">
                  <button class="btn btn-glass password-toggle" type="button" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="col-12"><button class="btn btn-accent w-100 btn-lg" type="submit">Crear cuenta</button></div>
            </div>
            <p class="small text-muted-2 text-center mt-3 mb-0">¿Ya tenés cuenta? <a href="iniciar-sesion.html">Iniciá sesión</a></p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/registro.js"></script>
</body>
</html>
