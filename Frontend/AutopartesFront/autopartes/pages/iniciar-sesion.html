<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Motorix Autopartes</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../styles/main.css" rel="stylesheet">
  <link href="../styles/animations.css" rel="stylesheet">
</head>
<body>
  <div id="app-header"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="glass p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="icon-tile mx-auto mb-3"><i class="bi bi-box-arrow-in-right"></i></div>
            <h1 class="h4 fw-bold">Iniciar sesión</h1>
            <p class="small text-muted-2 mb-0">Ingresá con tu cuenta para consultar y comprar autopartes.</p>
          </div>
<form id="clienteLoginForm" novalidate>
            <div class="mb-3"><label class="form-label" for="liEmail">Email</label><input id="liEmail" type="email" class="form-control" autocomplete="email" required maxlength="100"></div>
            <div class="mb-4"><label class="form-label" for="liClave">Contraseña</label><input id="liClave" type="password" class="form-control" autocomplete="current-password" required></div>
            <button class="btn btn-accent w-100 btn-lg" type="submit">Iniciar sesión</button>
            <p class="small text-muted-2 text-center mt-3 mb-0">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/iniciar-sesion.js"></script>
</body>
</html>
