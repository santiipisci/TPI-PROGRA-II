<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso administrador · Motorix Autopartes</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../styles/main.css" rel="stylesheet">
  <link href="../styles/animations.css" rel="stylesheet">
</head>
<body>
  <div id="app-header"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <form id="loginForm" class="glass p-4 p-md-5" novalidate>
          <div class="text-center mb-4">
            <div class="icon-tile mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
            <h1 class="h4 fw-bold">Acceso administrador</h1>
            <p class="small text-muted-2 mb-0">Ingresá para gestionar inventario y asociaciones.</p>
          </div>
          <div id="loginAlert"></div>
          <div class="mb-3"><label class="form-label" for="lUser">Usuario</label><input id="lUser" class="form-control" autocomplete="username" required></div>
          <div class="mb-4"><label class="form-label" for="lPass">Contraseña</label><input id="lPass" type="password" class="form-control" autocomplete="current-password" required></div>
          <button class="btn btn-accent w-100 btn-lg" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
