<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modelos de autos · Motorix Autopartes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../styles/main.css" rel="stylesheet">
  <link href="../styles/animations.css" rel="stylesheet">
</head>
<body>
  <div id="app-header"></div>

  <main class="container py-5">
    <div class="mb-4">
      <span class="mtx-eyebrow">Compatibilidad</span>
            <h1 class="mtx-section-title">Modelos de autos</h1>
            <p class="mtx-text-muted-2">Seleccioná un modelo para ver todas las autopartes asociadas.</p>
    </div>
    <div class="mtx-glass p-3 mb-4"><input id="mBuscar" type="search" class="form-control" placeholder="Buscar marca o modelo…"></div>
    <div class="row g-4" id="modelsGrid"></div>
  </main>

  <!-- Modal con partes del modelo -->
  <div class="modal fade" id="modelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
      <div class="modal-content mtx-glass mtx-glass-strong">
        <div class="modal-header border-0">
          <div><div class="mtx-model-brand" id="mdBrand"></div><h2 class="modal-title h4 fw-bold" id="mdTitle"></h2><div class="small mtx-text-muted-2" id="mdYears"></div></div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body"><div class="list-group list-group-flush" id="mdParts"></div></div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/modelos.js"></script>
</body>
</html>
